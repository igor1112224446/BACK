<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
:root{--ink:#1B2A33;--ink-2:#51616C;--line:#DCE2E6;--surface:#F3F5F6;--accent:#2F6F8F;--ok:#2E7D4F;--err:#B3261E}
*{box-sizing:border-box}
body{margin:0;width:360px;font:14px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:#fff}
header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
h1{font-size:15px;margin:0}
.muted{color:var(--ink-2);font-size:12px}
#list{max-height:300px;overflow:auto}
.obj-row{border-bottom:1px solid var(--line)}
.obj-row:has(.obj[aria-pressed="true"]){background:var(--surface)}
.src{display:block;padding:0 14px 9px 72px;font-size:12px;color:var(--accent);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src:hover{text-decoration:underline}
.obj{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:9px 14px;border:0;border-left:3px solid transparent;background:none;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.obj:hover{background:var(--surface)}
.obj[aria-pressed="true"]{border-left-color:var(--accent);background:var(--surface)}
.obj img{width:48px;height:48px;object-fit:cover;border-radius:5px;background:var(--line)}
.price{font-weight:700}
.done{color:var(--ok);font-size:12px;font-weight:600}
.actions{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center}
button.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 12px;cursor:pointer;font:inherit;font-weight:600}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
select,input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
#status{font-size:12px;min-height:16px}
.err{color:var(--err)}
details{padding:0 14px 12px}
summary{cursor:pointer;color:var(--ink-2);font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header><h1>Listing Hub</h1><span class="muted" id="site"></span></header>
<div class="actions" style="border-bottom:1px solid var(--line)">
  <div class="row">
    <button class="btn primary" id="grabThreads" style="flex:1">Для Threads</button>
    <button class="btn" id="grabMyhome" style="flex:1">Для MyHome</button>
  </div>
  <div class="row">
    <select id="pages" aria-label="Сколько страниц собрать">
      <option value="1">эту страницу</option><option value="3">3 страницы</option>
      <option value="5" selected>5 страниц</option><option value="10">10 страниц</option><option value="30">все (до 30)</option>
    </select>
    <button class="btn" id="grabAll" style="flex:1">Собрать объявления в базу</button>
  </div>
  <button class="btn" id="stopAll" hidden>Остановить сбор</button>
  <div id="grabStatus" class="muted" role="status" style="white-space:pre-line"></div>
  <div id="threadsOut" hidden>
    <label class="muted" for="threadsPost">Пост для Threads</label>
    <textarea id="threadsPost" rows="7" style="width:100%;box-sizing:border-box" aria-label="Пост для Threads"></textarea>
    <div class="row"><button class="btn" id="copyPost" style="flex:1">Копировать пост</button></div>
    <details>
      <summary>Полный перевод на русский</summary>
      <textarea id="threadsRu" rows="10" style="width:100%;box-sizing:border-box" aria-label="Полный перевод"></textarea>
      <button class="btn" id="copyRu">Копировать перевод</button>
    </details>
  </div>
</div>
<div id="list"><p class="muted" style="padding:14px">Загружаю объекты…</p></div>
<div class="actions">
  <div class="row">
    <label class="muted" for="lang">Описание на</label>
    <select id="lang"><option value="ka">грузинском</option><option value="ru">русском</option><option value="en">английском</option></select>
  </div>
  <button class="btn primary" id="fill" disabled>Заполнить форму</button>
  <button class="btn" id="mark" disabled>Отметить опубликованным</button>
  <div id="status" role="status"></div>
</div>
<details>
  <summary>Настройки и диагностика</summary>
  <div class="row" style="margin-top:8px">
    <input id="api" style="flex:1" aria-label="Адрес сервиса"><button class="btn" id="saveApi">OK</button>
  </div>
  <p class="muted">Сканер сохранит описание всех полей формы в файл — пришли его Claude, чтобы донастроить заполнение.</p>
  <button class="btn" id="scan">Сканировать форму</button>
</details>
<script src="popup.js"></script>
</body>
</html>
