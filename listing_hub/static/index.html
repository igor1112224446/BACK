<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Объекты — публикация</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2A33; --ink-2:#51616C; --line:#DCE2E6; --paper:#FFFFFF; --surface:#F3F5F6;
  --accent:#2F6F8F; --accent-ink:#FFFFFF;
  --ok:#2E7D4F; --wait:#B7791F; --err:#B3261E; --queue:#6B7A86; --idle:#E7ECEF;
  --font:"Golos Text","Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.5 var(--font);color:var(--ink);background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:380px 1fr;height:100vh}
@media (max-width:900px){.app{grid-template-columns:1fr;height:auto}.list{max-height:none}}

/* список объектов */
.list{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.list h1{font-size:20px;font-weight:700;margin:0}
.items{overflow:auto;flex:1}
.item{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:3px solid transparent;width:100%;text-align:left;border-top:0;border-right:0}
.item:hover{background:var(--surface)}
.item[aria-current="true"]{border-left-color:var(--accent);background:var(--surface)}
.item img{width:64px;height:64px;object-fit:cover;border-radius:6px;background:var(--idle)}
.item .price{font-weight:700;font-size:16px}
.item .meta{color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:40px 20px;color:var(--ink-2)}

/* полоса статусов площадок — главный элемент */
.strip{display:flex;gap:2px;margin-top:8px;border-radius:5px;overflow:hidden}
.strip span{flex:1;font-size:11px;font-weight:600;padding:3px 6px;background:var(--idle);color:var(--ink-2);white-space:nowrap}
.s-published{background:var(--ok)!important;color:#fff!important}
.s-waiting_you{background:var(--wait)!important;color:#fff!important}
.s-error{background:var(--err)!important;color:#fff!important}
.s-queued,.s-working{background:var(--queue)!important;color:#fff!important}
.s-skipped{background:var(--idle)!important;text-decoration:line-through}

/* основная панель */
main{overflow:auto;padding:28px 36px 60px}
@media (max-width:600px){main{padding:20px 16px}}
h2{font-size:24px;font-weight:700;margin:0 0 4px}
.sub{color:var(--ink-2);margin:0 0 24px}
section{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px;max-width:900px}
section h3{font-size:16px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:9px 10px;background:var(--paper);color:var(--ink);font-size:15px}
textarea{resize:vertical;min-height:90px;width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.small{padding:5px 10px;font-size:13px}
a.btn{text-decoration:none;color:var(--ink);display:inline-block}
.hint{font-size:13px;color:var(--ink-2)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--ink-2);cursor:pointer}
.drop.over{border-color:var(--accent);color:var(--accent)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:12px}
.thumbs figure{margin:0;position:relative}
.thumbs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block}
.thumbs button{position:absolute;top:4px;right:4px;border:0;border-radius:4px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;padding:2px 7px}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:6px 6px 0 0;padding:6px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--paper);border-bottom-color:var(--paper);font-weight:600}
.pubs{display:flex;flex-direction:column;gap:10px}
.pub{display:grid;grid-template-columns:24px 110px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.pub .dot{width:12px;height:12px;border-radius:50%;background:var(--idle)}
.pub .state{font-size:13px;color:var(--ink-2)}
.pub .state a{color:var(--accent)}
.err{color:var(--err)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="list">
    <header><h1>Объекты</h1><div class="row"><a class="btn" href="/crm">База объявлений</a><button class="btn primary" id="newBtn">Добавить объект</button></div></header>
    <div class="items" id="items"></div>
    <p class="hint" id="dataDir" style="padding:10px 20px;margin:0;border-top:1px solid var(--line)"></p>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const UNCHECKED=new Set();
let CONF = {platforms:{}}, LIST = [], CURRENT = null, NEW_PHOTOS = [];

const STATUS = {
  queued:"В очереди", working:"Агент заполняет форму", waiting_you:"Ждёт твоей проверки в браузере",
  published:"Опубликовано", error:"Ошибка", skipped:"Пропущено"
};
const FIELDS = [
  ["deal","Сделка","select",[["sale","Продажа"],["rent","Аренда"],["daily_rent","Посуточно"]]],
  ["property_type","Тип","select",[["apartment","Квартира"],["house","Дом"],["commercial","Коммерция"],["land","Земля"]]],
  ["price","Цена, $","number"],["area","Площадь, м²","number"],["rooms","Комнат","number"],["bedrooms","Спален","number"],
  ["floor","Этаж","number"],["floors_total","Этажей в доме","number"],["city","Город","text"],["district","Район","text"],
  ["address","Улица, дом","text"],
  ["condition","Состояние","select",[["","—"],["new_renovation","Новый ремонт"],["old_renovation","Старый ремонт"],["white_frame","Белый каркас"],["black_frame","Чёрный каркас"],["green_frame","Зелёный каркас"],["needs_renovation","Требует ремонта"]]],
  ["building_status","Дом","select",[["","—"],["old_building","Старый фонд"],["new_building","Новостройка"],["under_construction","Строится"]]],
  ["cadastral_code","Кадастровый код","text"],
];

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2600)}
async function api(url,opt={}){const r=await fetch(url,opt);if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail}catch{}throw new Error(m)}return r.json()}
const media = p => "/" + p.replace(/\\/g,"/");
const paramsLine = d => [d.rooms&&`${d.rooms}-комн.`, d.area&&`${d.area} м²`, d.floor&&`${d.floor}/${d.floors_total||"?"} эт.`, d.district].filter(Boolean).join(", ");

function strip(item){
  return `<div class="strip">${Object.entries(CONF.platforms).map(([k,p])=>{
    const st=item.publications[k]?.status||""; return `<span class="s-${st}" title="${esc(p.title)}: ${esc(STATUS[st]||"не публиковался")}">${esc(p.title)}</span>`}).join("")}</div>`;
}

function renderList(){
  const box=$("#items");
  if(!LIST.length){box.innerHTML=`<p class="empty">Пока пусто. Добавь первый объект — фото и пара строк описания.</p>`;return}
  box.innerHTML=LIST.map(it=>`<button class="item" data-id="${it.id}" aria-current="${CURRENT===it.id}">
    <img src="${it.photos_wm[0]?media(it.photos_wm[0]):""}" alt="">
    <div><div class="price">${it.data.price?Number(it.data.price).toLocaleString("ru-RU")+" $":"Без цены"}</div>
    <div class="meta">${esc(paramsLine(it.data))||"&nbsp;"}</div>
    ${it.data.source_url?`<div class="meta">из ${esc((()=>{try{return new URL(it.data.source_url).hostname.replace(/^www\./,"")}catch{return "ссылки"}})())}</div>`:""}${strip(it)}</div></button>`).join("");
  box.querySelectorAll(".item").forEach(b=>b.onclick=()=>openItem(+b.dataset.id));
}

/* ---------- новый объект ---------- */
function renderNew(){
  CURRENT=null; NEW_PHOTOS=[]; renderList();
  $("#main").innerHTML=`
  <h2>Новый объект</h2><p class="sub">Заполни поля или опиши объект одним сообщением — ИИ разложит его по полям.</p>
  <section><h3>Быстрый ввод</h3>
    <textarea id="free" placeholder="Например: продаю 3-комн. в Ваке, Чавчавадзе 45, 85 м², 9 из 16, свежий ремонт, балкон с видом, парковка. 185к"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn" id="extractBtn" ${CONF.ai?"":"disabled"}>Разобрать текст</button>
    ${CONF.ai?"":`<span class="hint">ИИ не подключён — заполни поля вручную</span>`}</div>
  </section>
  <section><h3>Параметры</h3><div class="grid" id="fields">${FIELDS.map(fieldHtml).join("")}</div>
    <label style="margin-top:12px">Особенности и заметки для текста<textarea id="f_notes" placeholder="Балкон, вид на горы, мебель остаётся, рядом метро…"></textarea></label>
  </section>
  <section><h3>Фото</h3>
    <div class="drop" id="drop" tabindex="0">Перетащи фото сюда или нажми, чтобы выбрать. Первое фото станет обложкой.</div>
    <input type="file" id="fileIn" accept="image/*" multiple hidden><div class="thumbs" id="thumbs"></div>
  </section>
  <div class="row"><button class="btn primary" id="saveBtn">Сохранить объект</button></div>`;
  const drop=$("#drop"), fi=$("#fileIn");
  drop.onclick=()=>fi.click(); drop.onkeydown=e=>{if(e.key==="Enter"||e.key===" ")fi.click()};
  fi.onchange=()=>addPhotos(fi.files);
  drop.ondragover=e=>{e.preventDefault();drop.classList.add("over")};
  drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");addPhotos(e.dataTransfer.files)};
  $("#extractBtn").onclick=extract; $("#saveBtn").onclick=save;
}
function fieldHtml([k,label,type,opts]){
  if(type==="select") return `<label>${label}<select id="f_${k}">${opts.map(([v,t])=>`<option value="${v}">${t}</option>`).join("")}</select></label>`;
  return `<label>${label}<input id="f_${k}" type="${type}" ${type==="number"?'step="any" min="0"':""}></label>`;
}
function addPhotos(files){
  for(const f of files) if(f.type.startsWith("image/")) NEW_PHOTOS.push(f);
  $("#thumbs").innerHTML=NEW_PHOTOS.map((f,i)=>`<figure><img src="${URL.createObjectURL(f)}" alt=""><button data-i="${i}" aria-label="Убрать фото">×</button></figure>`).join("");
  $("#thumbs").querySelectorAll("button").forEach(b=>b.onclick=()=>{NEW_PHOTOS.splice(+b.dataset.i,1);addPhotos([])});
}
async function extract(){
  const t=$("#free").value.trim(); if(!t) return toast("Сначала напиши описание объекта");
  const b=$("#extractBtn"); b.disabled=true; b.textContent="Разбираю…";
  try{
    const d=await api("/api/extract",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t})});
    FIELDS.forEach(([k])=>{if(d[k]!=null&&$("#f_"+k)) $("#f_"+k).value=d[k]});
    const extra=[d.features&&[].concat(d.features).join(", "), t].filter(Boolean).join("\n");
    if(!$("#f_notes").value) $("#f_notes").value=extra;
    toast("Поля заполнены — проверь их");
  }catch(e){toast(e.message)} finally{b.disabled=false;b.textContent="Разобрать текст"}
}
async function save(){
  if(!NEW_PHOTOS.length) return toast("Добавь хотя бы одно фото");
  const d={}; FIELDS.forEach(([k,,type])=>{const v=$("#f_"+k).value; if(v!=="") d[k]=type==="number"?Number(v):v});
  d.notes=$("#f_notes").value.trim();
  if(!d.price) return toast("Укажи цену");
  const fd=new FormData(); fd.append("data",JSON.stringify(d)); NEW_PHOTOS.forEach(f=>fd.append("photos",f));
  const b=$("#saveBtn"); b.disabled=true; b.textContent=CONF.ai?"Сохраняю и пишу тексты…":"Сохраняю…";
  try{const it=await api("/api/listings",{method:"POST",body:fd}); await load(); openItem(it.id); toast("Объект сохранён")}
  catch(e){toast(e.message);b.disabled=false;b.textContent="Сохранить объект"}
}

/* ---------- карточка объекта ---------- */
let LANG="ka";
function openItem(id){
  CURRENT=id; renderList();
  const it=LIST.find(x=>x.id===id); if(!it) return;
  const d=it.data;
  $("#main").innerHTML=`
  <h2>${d.price?Number(d.price).toLocaleString("ru-RU")+" $":"Без цены"}</h2>
  <p class="sub">${esc(paramsLine(d))}${d.address?", "+esc(d.address):""}</p>
  <section><h3>Источник</h3>
    <div class="row"><input id="srcUrl" style="flex:1;min-width:220px" placeholder="Ссылка на оригинальное объявление" value="${esc(d.source_url||"")}">
    ${d.source_url?`<a class="btn" href="${esc(d.source_url)}" target="_blank" rel="noopener">Открыть оригинал ↗</a>`:""}
    <button class="btn" id="saveSrc">Сохранить ссылку</button></div>
    <p class="hint" style="margin:8px 0 0">${d.source_url?"Откуда взято объявление: "+esc(new URL(d.source_url).hostname):"Ссылка подставляется сама, если сохранять объявление кнопкой расширения со страницы."}</p>
  </section>
  <section><h3>Публикация</h3><div class="pubs" id="pubs"></div>
    ${Object.values(CONF.platforms).some(p=>p.method!=="extension")?`<div class="row" style="margin-top:14px"><button class="btn primary" id="pubBtn">Опубликовать на отмеченных</button>
    <span class="hint">Режим: ${CONF.mode==="auto"?"агент публикует сам":"агент заполняет форму, ты проверяешь и публикуешь"}. Агент должен быть запущен (worker.py).</span></div>`:`<p class="hint" style="margin-top:12px">Публикация идёт через расширение Chrome: открой форму добавления объявления на площадке, нажми значок Listing Hub, выбери этот объект и «Заполнить форму». После публикации нажми там «Отметить опубликованным» — здесь площадка станет зелёной.</p>`}
  </section>
  <section><h3>Текст объявления</h3>
    <div class="tabs" role="tablist">${["ka","ru","en"].map(l=>`<button role="tab" data-l="${l}" aria-selected="${LANG===l}">${{ka:"ქართული",ru:"Русский",en:"English"}[l]}</button>`).join("")}</div>
    <label>Заголовок<input id="t_title"></label>
    <label style="margin-top:10px">Описание<textarea id="t_desc" rows="9"></textarea></label>
    <div class="row" style="margin-top:10px"><button class="btn" id="saveText">Сохранить текст</button><button class="btn" id="regenText">Написать заново</button><button class="btn" id="trBtn">Перевести с этого языка на остальные</button></div><div id="trLinks" class="row" style="margin-top:6px">
    ${d.ai_error?`<span class="hint err">ИИ не сработал, тексты по шаблону: ${esc(d.ai_error)}</span>`:""}</div>
  </section>
  <section><h3>Фото</h3><div class="thumbs">${it.photos_wm.map(p=>`<figure><img src="${media(p)}?v=${encodeURIComponent(it.updated_at||"")}" alt=""></figure>`).join("")}</div>
    <div class="row" style="margin-top:12px">
      ${!d.source_url||d.own_listing?`<button class="btn" id="wmBtn">Попробовать убрать водяной знак</button>`:`<span class="hint">Убрать водяной знак можно только у объявлений из твоего аккаунта MyHome.</span>`}
      ${d.wm_removed?`<button class="btn" id="wmUndo">Вернуть исходные фото</button>`:""}
    </div></section>
  ${!d.source_url||d.own_listing?`<section><h3>Фото для Korter</h3>
    <p class="hint" style="margin:0 0 10px">Отдельный набор только для Korter: без водяного знака MyHome, другая обложка, лёгкая обрезка, поворот на 1–2° и чуть другая яркость. Оригиналы не меняются.</p>
    ${d.photos_korter?.length?`<div class="thumbs">${d.photos_korter.map(p=>`<figure><img src="${media(p)}?v=${encodeURIComponent(it.updated_at||"")}" alt=""></figure>`).join("")}</div>`:""}
    <div class="row" style="margin-top:12px">
      <label class="hint" style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="kLogo"> поставить мой логотип и телефон</label>
      <button class="btn" id="kPrep">${d.photos_korter?.length?"Подготовить заново":"Подготовить фото для Korter"}</button>
      ${d.photos_korter?.length?`<button class="btn" id="kReset">Убрать набор</button>`:""}
    </div></section>`:""}
  <button class="btn" id="delBtn">Удалить объект</button>`;
  renderPubs(it); fillText(it);
  if($("#wmBtn")) $("#wmBtn").onclick=async()=>{
    const b=$("#wmBtn"); b.disabled=true; b.textContent="Обрабатываю фото…";
    try{const r=await api(`/api/listings/${id}/remove_watermark`,{method:"POST"}); await load(); openItem(id); toast(r.message||"Готово")}
    catch(e){toast(e.message); b.disabled=false; b.textContent="Попробовать убрать водяной знак"}
  };
  if($("#kPrep")) $("#kPrep").onclick=async()=>{
    const b=$("#kPrep"); b.disabled=true; b.textContent="Обрабатываю фото…";
    try{const r=await api(`/api/listings/${id}/prepare_korter`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({add_logo:$("#kLogo").checked,remove_wm:true})});
      await load(); openItem(id); toast(r.message)}
    catch(e){toast(e.message); b.disabled=false; b.textContent="Подготовить фото для Korter"}
  };
  if($("#kReset")) $("#kReset").onclick=async()=>{await api(`/api/listings/${id}/prepare_korter`,{method:"DELETE"}); await load(); openItem(id); toast("Набор для Korter убран")};
  if($("#wmUndo")) $("#wmUndo").onclick=async()=>{await api(`/api/listings/${id}/restore_photos`,{method:"POST"}); await load(); openItem(id); toast("Исходные фото возвращены")};
  $("#saveSrc").onclick=async()=>{
    const v=$("#srcUrl").value.trim();
    if(v && !/^https?:\/\//.test(v)) return toast("Ссылка должна начинаться с http:// или https://");
    await api(`/api/listings/${id}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({source_url:v||null})});
    await load(); openItem(id); toast("Ссылка сохранена");
  };
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{LANG=b.dataset.l;openItem(id)});
  $("#saveText").onclick=async()=>{
    await api(`/api/listings/${id}`,{method:"PUT",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({["title_"+LANG]:$("#t_title").value,["description_"+LANG]:$("#t_desc").value})});
    await load(); toast("Текст сохранён");
  };
  $("#trBtn").onclick=()=>translateAll(id, LANG);
  $("#regenText").onclick=async()=>{
    if(!confirm("Заменить заголовки и описания на всех языках новым текстом?")) return;
    await api(`/api/listings/${id}/regenerate`,{method:"POST"}); await load(); openItem(id); toast("Текст написан заново");
  };
  if($("#pubBtn")) $("#pubBtn").onclick=async()=>{
    const ps=[...document.querySelectorAll(".pubchk:checked")].map(c=>c.value);
    if(!ps.length) return toast("Отметь хотя бы одну площадку");
    await api(`/api/listings/${id}/publish`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({platforms:ps})});
    await load(); renderPubs(LIST.find(x=>x.id===id)); toast("Поставлено в очередь");
  };
  $("#delBtn").onclick=async()=>{if(confirm("Удалить объект из сервиса? С площадок он не снимется.")){await api(`/api/listings/${id}`,{method:"DELETE"});await load();renderNew()}};
}
function fillText(it){$("#t_title").value=it.data["title_"+LANG]||"";$("#t_desc").value=it.data["description_"+LANG]||""}
function renderPubs(it){
  const box=$("#pubs"); if(!box) return;
  box.innerHTML=Object.entries(CONF.platforms).map(([k,p])=>{
    const pub=it.publications[k]||{}, st=pub.status||"";
    const busy=["queued","working","waiting_you"].includes(st), done=st==="published";
    let state=STATUS[st]||(p.method==="extension"?"Не опубликован. Открой форму на сайте площадки и нажми значок расширения Listing Hub":(p.ready?"Не публиковался":"Площадка не настроена"));
    if(done&&pub.url) state+=` — <a href="${esc(pub.url)}" target="_blank" rel="noopener">открыть</a>`;
    if(pub.error) state+=`<br><span class="err">${esc(pub.error)}</span>`;
    const actions= st==="waiting_you"
      ? `<div class="row"><button class="btn small primary" data-a="published" data-p="${k}">Опубликовано</button><button class="btn small" data-a="skipped" data-p="${k}">Пропустить</button></div>`
      : st==="error" ? `<button class="btn small" data-a="queued" data-p="${k}">Повторить</button>` : "";
    const chk = p.method==="extension" ? `<span aria-hidden="true"></span>` :
      `<input type="checkbox" class="pubchk" value="${k}" aria-label="${esc(p.title)}" ${busy||done||!p.ready?"disabled":(UNCHECKED.has(k)?"":"checked")}>`;
    return `<div class="pub">${chk}
      <strong>${esc(p.title)}</strong><span class="state"><span class="dot s-${st}" style="display:inline-block;vertical-align:middle;margin-right:6px"></span>${state}</span>${actions}</div>`;
  }).join("");
  box.querySelectorAll(".pubchk").forEach(c=>c.onchange=()=>c.checked?UNCHECKED.delete(c.value):UNCHECKED.add(c.value));
  box.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{
    const body={status:b.dataset.a}; if(b.dataset.a==="published") body.url=prompt("Ссылка на объявление (можно оставить пустой):")||null;
    await api(`/api/listings/${it.id}/publications/${b.dataset.p}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    await load(); renderPubs(LIST.find(x=>x.id===it.id));
  });
}


/* ---------- перевод текста объявления ----------
   Встроенный переводчик Chrome (работает на компьютере, бесплатно, без ключей). Если язык не поддерживается —
   открываем Google Переводчик с готовым текстом, оттуда перевод вставляется вручную. */
async function translateAll(id, from){
  const title=$("#t_title").value.trim(), desc=$("#t_desc").value.trim();
  if(!desc) return toast("Сначала напиши текст на этом языке");
  const targets=["ka","ru","en"].filter(l=>l!==from), names={ka:"грузинский",ru:"русский",en:"английский"};
  const upd={["title_"+from]:title,["description_"+from]:desc}, manual=[];
  const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]);
  const b=$("#trBtn"); b.disabled=true; b.textContent="Перевожу…";
  for(const to of targets){
    try{
      if(!("Translator" in self)) throw new Error("no api");
      const av=await Translator.availability({sourceLanguage:from,targetLanguage:to});
      if(av==="unavailable") throw new Error("unsupported");
      const tr=await withTimeout(Translator.create({sourceLanguage:from,targetLanguage:to,
        monitor(m){m.addEventListener("downloadprogress",e=>toast(`Загружаю переводчик (${names[to]}): ${Math.round(e.loaded*100)}%`))}}),120000);
      upd["title_"+to]=title?await tr.translate(title):"";
      upd["description_"+to]=await tr.translate(desc);
    }catch(e){ manual.push(to); }
  }
  await api(`/api/listings/${id}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(upd)});
  await load(); openItem(id);
  const done=targets.filter(t=>!manual.includes(t));
  if(done.length) toast("Переведено: "+done.map(t=>names[t]).join(", "));
  // браузер не даёт открывать вкладки сам — показываем ссылки, по которым нужно кликнуть
  const box=$("#trLinks");
  if(box) box.innerHTML = manual.length ? `<p class="hint" style="margin:8px 0 4px">Встроенный переводчик Chrome не поддерживает этот язык. Открой перевод, скопируй его во вкладку языка и нажми «Сохранить текст»:</p>` +
    manual.map(to=>`<a class="btn small" target="_blank" rel="noopener" href="https://translate.google.com/?sl=${from}&tl=${to}&text=${encodeURIComponent((title?title+"\n\n":"")+desc)}&op=translate">Перевод на ${names[to]} ↗</a>`).join(" ") : "";
}

async function load(){LIST=await api("/api/listings");renderList()}
async function poll(){
  try{await load(); if(CURRENT){const it=LIST.find(x=>x.id===CURRENT); if(it) renderPubs(it)}}catch{}
  setTimeout(poll,4000);
}
(async()=>{CONF=await api("/api/config");if(CONF.data_dir)$("#dataDir").textContent="Объекты хранятся в "+CONF.data_dir+" (каждый день делается резервная копия)";$("#newBtn").onclick=renderNew;await load();LIST.length?openItem(LIST[0].id):renderNew();setTimeout(poll,4000)})();
</script>
